# config.yaml: single source of settings for the METABRIC v2 pipeline.
# Paths are relative to the project root (the folder holding this file).
# Changing any value changes the config hash and therefore the run_id.

project: metabric_v2
seed: 42

paths:
  data: data/METABRIC_RNA_Mutation.csv
  outputs: outputs
  reference: reference
  crosswalk: reference/crosswalk
  holdout: outputs/frozen/holdout.csv

target:
  source_column: overall_survival   # file: 1 = alive, 0 = died
  name: death                       # positive class = death = 1 - overall_survival

holdout:
  fraction: 0.20
  stratify: [death, cohort, chemotherapy]
  min_stratum_count: 2              # strata smaller than this are merged (logged)
  sha256: "0fe1e9e49bcaa84977c82227245b94c264dbb57e6c039c6da7573894ed8e220c"                      # filled once when the holdout is created; verified on every run

# Low compute budget (CLAUDE.md section 6). Used from build step 2 onward.
cv:
  outer_folds: 5
  outer_repeats: 2
  inner_folds: 3
  first_arms: [C, C+RNA, strict_clinical]

# Floors: always reported, never eligible to win (CLAUDE.md section 5). Built in step 2.
floors:
  majority: {}
  age_only: {features: [age_at_diagnosis]}
  npi_file: {features: [nottingham_prognostic_index], primary: true,
             label: "NPI as supplied (size weight 0.02 per cm)"}                # F-021, F-028
  npi_standard: {features: [npi_standard], primary: false,
                 label: "Standard NPI (0.2 x size cm + node stage + grade)",
                 missing: "in-fold median fill plus missing indicator"}         # computed by data.npi_standard

gene_sets:
  files:                            # exactly these two files; anything else in reference/ is ignored
    hallmark: h.all.v2026.2.Hs.symbols.gmt
    reactome: ReactomePathways.gmt
  aliases: reference/crosswalk/symbol_aliases.csv
  min_rna_overlap: 5                # owner confirmed 2026-11-16
  expected_coverage:                # CLAUDE.md section 3b sanity check, updated for the HIST1H2BC -> H2BC4 alias (F-029);
                                    # without the alias Reactome was 427 / 140 / 644 / 329
    hallmark: {n_sets: 50, rna_covered: 260, dna_covered: 71, sets_pass: 40}
    reactome: {n_sets: 2874, rna_covered: 428, dna_covered: 141, sets_pass: 647, sets_ge10: 334, median_rna_overlap: 1}

clinical_types:
  numeric: [age_at_diagnosis, lymph_nodes_examined_positive, mutation_count, nottingham_prognostic_index, tumor_size]
  ordinal: [neoplasm_histologic_grade, tumor_stage]
  binary: [chemotherapy, hormone_therapy, radio_therapy]
  categorical: [type_of_breast_surgery, cancer_type, cancer_type_detailed, cellularity, "pam50_+_claudin-low_subtype",
                cohort, er_status_measured_by_ihc, er_status, her2_status_measured_by_snp6, her2_status,
                tumor_other_histologic_subtype, inferred_menopausal_state, integrative_cluster,
                primary_tumor_laterality, oncotree_code, pr_status, "3-gene_classifier_subtype"]

groups:
  treatment: [chemotherapy, hormone_therapy, radio_therapy, type_of_breast_surgery]
  molecular_derived: ["pam50_+_claudin-low_subtype", integrative_cluster, "3-gene_classifier_subtype", cohort]

eda:
  permutations: 1000
  fdr_alpha: 0.05
  rare_level_min_count: 20
  mutation_freq_threshold: 0.01
  corr_thresholds: [0.5, 0.7]
  pca_variance_targets: [0.5, 0.8, 0.9]
  cluster_k: [5, 10]
  cluster_n_pcs: 33
  module_distance_cut: 0.5          # average linkage on 1 - |r|
  module_min_size: 5
  cohort_classifier_folds: 5
  age_bands: [0, 40, 50, 60, 70, 80, 200]
  node_bands: [0, 1, 4, 10, 1000]   # 0, 1-3, 4-9, 10+
  npi_bands: [0, 3.4, 5.4, 100]     # good, moderate, poor
  figure_dpi: 150
  split_balance:
    max_abs_diff_stratified: 0.02   # fail if a stratified variable differs more than this
    warn_smd: 0.10                  # warn for other treatment / age imbalance

# Reference values (PLAN.md section 17). tol 0 = exact.

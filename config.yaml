# config.yaml: single source of settings for the METABRIC v2 pipeline.
# Paths are relative to the project root (the folder holding this file).
# Changing any value changes the config hash and therefore the run_id.

project: metabric_v2
seed: 42

paths:
  data: data/METABRIC_RNA_Mutation.csv
  outputs: outputs
  reference: reference
  crosswalk: reference/crosswalk
  holdout: outputs/frozen/holdout.csv
  cv_splits: outputs/frozen/cv_splits.csv

target:
  source_column: overall_survival   # file: 1 = alive, 0 = died
  name: death                       # positive class = death = 1 - overall_survival

holdout:
  fraction: 0.20
  stratify: [death, cohort, chemotherapy]
  min_stratum_count: 2              # strata smaller than this are merged (logged)
  sha256: "0fe1e9e49bcaa84977c82227245b94c264dbb57e6c039c6da7573894ed8e220c"                      # filled once when the holdout is created; verified on every run

# Low compute budget (CLAUDE.md section 6). Used from build step 2 onward.
cv:
  outer_folds: 5
  outer_repeats: 2
  inner_folds: 3
  first_arms: [C, C+RNA, strict_clinical]
  # seeds derived from `seed`: outer repeat r -> seed + r; inner split of (r, k) -> seed + 1000 * (r + 1) + k
  splits_sha256: "e4707dfe840a54713856877d13cf0e4a5cc80dae8f78d41aeee16897a7ff562b"               # filled once when the CV splits are created; verified on every run

# Evaluation harness (CLAUDE.md section 7, PLAN.md section 6). Thresholds fixed before any real run.
harness:
  operating_point_sensitivity: 0.80 # threshold fixed on inner-fold predictions, applied to the outer fold
  recalibration: platt              # fitted on inner out-of-fold predictions, inside the outer fold
  reliability_bins: 10              # quantile bins
  n_boot: 200                       # bootstrap resamples for subgroup intervals
  n_permutations: 20                # label-permutation test of the full procedure (low budget)
  chance_band: 0.03                 # permuted-label mean AUROC must lie within 0.5 +/- this
  select_within_se: 1.0             # simpler candidate wins within this many SE of the best inner AUROC
  learning_curve_fractions: [0.25, 0.5, 0.75, 1.0]
  overfit_gate:                     # limits fixed before running (F-031, F-035); action revised by owner (F-042)
    max_train_cv_auroc_gap: 0.05    # gap above this = overfitting flag
    min_calibration_slope: 0.8      # slope below this (over-confident) = overfitting flag
    recalibrate_above_slope: 1.2    # slope above this (under-confident) = needs recalibration: recalibrated probabilities are primary
    action: report                  # flags are reported; they never exclude a configuration from selection
  subgroups: [chemotherapy, hormone_therapy, radio_therapy, type_of_breast_surgery, chemo_x_hormone]
  regression_floor_sd: 2            # regression floor = mean - 2 SD of outer-fold AUROC (B5)

# Model farm (step 3). Small grids for the first pass; raise later without code changes.
farm:
  n_jobs: auto                      # auto = logical cores - 1 (at least 1); or an integer
  members: [logreg_en, svm_rbf, random_forest, xgboost, mlp, mlp_embed, multimodal]   # 3a classical + 3b neural
  n_permutations: 3                 # permutation test of the full <permutation_arm>|best procedure; low budget (F-043, F-046)
  permutation_arm: DNA              # 3c: exercises the new DNA representations; C|best passed in 3b (F-045)
  arms:                             # rna_reps / dna_reps default to every representation; neural: false defers the
                                    # neural members on that arm to final testing (F-046)
    C: {blocks: [clinical]}
    C+RNA: {blocks: [clinical, rna], rna_reps: [all, top15, top30, top50, pca10, pca30, hallmark, reactome, modules, dae8, dae32]}
    strict_clinical: {blocks: [clinical], drop: [molecular_derived]}
    C+DNA: {blocks: [clinical, dna], dna_reps: [flags, known5, count, pathway, bagemb], neural: false}
    C+RNA+DNA: {blocks: [clinical, rna, dna], rna_reps: [pca10, hallmark], dna_reps: [flags, known5, pathway], neural: false}
    RNA: {blocks: [rna], rna_reps: [all, top30, pca10, hallmark, modules, dae8], neural: false}
    RNA+DNA: {blocks: [rna, dna], rna_reps: [pca10, hallmark], dna_reps: [flags, known5, pathway], neural: false}
    DNA: {blocks: [dna], dna_reps: [flags, known5, count, pathway, bagemb], neural: false}
  # one column per concept (F-039): oncotree_code == cancer_type_detailed, which
  # tumor_other_histologic_subtype determines; cancer_type has one sarcoma; NPI is a composite of
  # size, nodes and grade (floor only)
  drop_clinical: [oncotree_code, cancer_type_detailed, cancer_type, nottingham_prognostic_index]
  rare_level_min_count: 20          # rarer categorical levels are pooled inside the fold
  rna_representations:              # all fitted inside the fold; none reads the outcome except top-k selection
    all: {}                         # all 489 genes; linear members penalise them harder via rna_scale
    top15: {topk: 15}
    top30: {topk: 30}
    top50: {topk: 50}
    pca10: {pca: 10}
    pca30: {pca: 30}
    hallmark: {sets: hallmark}      # one score per Hallmark set (mean z of its matched genes)
    reactome: {sets: reactome}      # one score per Reactome set with enough matched genes
    modules: {modules: true}        # co-expression modules found on the fitting rows
    dae8: {dae: 8}                  # denoising-autoencoder latent (8 dims)
    dae32: {dae: 32}                # denoising-autoencoder latent (32 dims)
  gene_set_scores: {hallmark_min_rna: 5, reactome_min_rna: 10}   # Hallmark: the 5-gene minimum; Reactome: 10 (334 sets)
  modules: {distance_cut: 0.7, min_size: 5}                      # average linkage on 1 - |r|
  dae: {hidden: 128, mask: 0.2, weight_decay: 0.0001, lr: 0.001, max_epochs: 150, patience: 10, batch_size: 128,
        val_fraction: 0.15, n_seeds: 2}                          # best seed by held-out reconstruction loss
  ae_members: [logreg_en, svm_rbf, xgboost]                      # autoencoder latents offered to these (PLAN section 5)
  dna_representations:              # from the 173 binary mutation flags; all unsupervised
    flags: {}                       # all 173 flags
    known5: {known: [tp53_mut, pik3ca_mut, gata3_mut, cdh1_mut, map3k1_mut]}
    count: {count: true}            # number of mutated genes among the 173
    pathway: {pathway: hallmark, min_dna: 3}                     # 25 Hallmark sets: any gene mutated
    bagemb: {embed: 8}              # bag-of-mutations: co-occurrence gene vectors (SVD), averaged per patient
  rna_scale: 0.5                    # standardised genes x 0.5 = 4x the L2 penalty of clinical columns
  topk_selection: {n_subsamples: 10, fraction: 0.5, C: 0.05}   # selection frequency under L1 logistic regression
  complexity_rule: "member family first (logreg < svm_rbf < random_forest = xgboost < mlp = mlp_embed < multimodal), then fewer omics inputs, then stronger regularisation"
  grids:
    logreg_en: {C: [0.01, 0.1, 1.0], l1_ratio: [0.0, 0.5, 1.0]}
    svm_rbf: {C: [0.1, 1.0, 10.0], gamma: [scale]}
    random_forest: {n_estimators: [300], max_features: [sqrt, 0.2], min_samples_leaf: [5, 20]}
    xgboost: {n_estimators: [300], learning_rate: [0.05], max_depth: [2, 4], subsample: [0.8],
              colsample_bytree: [0.5, 0.8], min_child_weight: [5]}
    mlp: {hidden: [[32], [64, 32]], dropout: [0.3], weight_decay: [0.001]}
    mlp_embed: {hidden: [[32], [64, 32]], dropout: [0.3], weight_decay: [0.001]}
    multimodal: {block_dropout: [0.1, 0.3], dropout: [0.3], weight_decay: [0.001]}
  neural_rna_representations: [all, pca10]      # mlp / mlp_embed on C+RNA (multimodal always uses all genes)
  neural:                                       # shared training settings for the three neural members
    lr: 0.001
    max_epochs: 200
    patience: 15                    # early stopping on a stratified 15% validation split of the fitting rows
    batch_size: 128
    val_fraction: 0.15
    n_seeds: 2                      # predictions averaged over seeds

# Floors: always reported, never eligible to win (CLAUDE.md section 5). Built in step 2.
floors:
  majority: {}
  age_only: {features: [age_at_diagnosis]}
  npi_file: {features: [nottingham_prognostic_index], primary: true,
             label: "NPI as supplied (size weight 0.02 per cm)"}                # F-021, F-028
  npi_standard: {features: [npi_standard], primary: false,
                 label: "Standard NPI (0.2 x size cm + node stage + grade)",
                 missing: "in-fold median fill plus missing indicator"}         # computed by data.npi_standard

gene_sets:
  files:                            # exactly these two files; anything else in reference/ is ignored
    hallmark: h.all.v2026.2.Hs.symbols.gmt
    reactome: ReactomePathways.gmt
  aliases: reference/crosswalk/symbol_aliases.csv
  min_rna_overlap: 5                # owner confirmed 2026-11-16
  expected_coverage:                # CLAUDE.md section 3b sanity check, updated for the HIST1H2BC -> H2BC4 alias (F-029);
                                    # without the alias Reactome was 427 / 140 / 644 / 329
    hallmark: {n_sets: 50, rna_covered: 260, dna_covered: 71, sets_pass: 40}
    reactome: {n_sets: 2874, rna_covered: 428, dna_covered: 141, sets_pass: 647, sets_ge10: 334, median_rna_overlap: 1}

clinical_types:
  numeric: [age_at_diagnosis, lymph_nodes_examined_positive, mutation_count, nottingham_prognostic_index, tumor_size]
  ordinal: [neoplasm_histologic_grade, tumor_stage]
  binary: [chemotherapy, hormone_therapy, radio_therapy]
  categorical: [type_of_breast_surgery, cancer_type, cancer_type_detailed, cellularity, "pam50_+_claudin-low_subtype",
                cohort, er_status_measured_by_ihc, er_status, her2_status_measured_by_snp6, her2_status,
                tumor_other_histologic_subtype, inferred_menopausal_state, integrative_cluster,
                primary_tumor_laterality, oncotree_code, pr_status, "3-gene_classifier_subtype"]

groups:
  treatment: [chemotherapy, hormone_therapy, radio_therapy, type_of_breast_surgery]
  molecular_derived: ["pam50_+_claudin-low_subtype", integrative_cluster, "3-gene_classifier_subtype", cohort]

eda:
  permutations: 1000
  fdr_alpha: 0.05
  rare_level_min_count: 20
  mutation_freq_threshold: 0.01
  corr_thresholds: [0.5, 0.7]
  pca_variance_targets: [0.5, 0.8, 0.9]
  cluster_k: [5, 10]
  cluster_n_pcs: 33
  module_distance_cut: 0.5          # average linkage on 1 - |r|
  module_min_size: 5
  cohort_classifier_folds: 5
  age_bands: [0, 40, 50, 60, 70, 80, 200]
  node_bands: [0, 1, 4, 10, 1000]   # 0, 1-3, 4-9, 10+
  npi_bands: [0, 3.4, 5.4, 100]     # good, moderate, poor
  figure_dpi: 150
  split_balance:
    max_abs_diff_stratified: 0.02   # fail if a stratified variable differs more than this
    warn_smd: 0.10                  # warn for other treatment / age imbalance

